# =============================================================================
# SentinelX 基础设施 - GitHub 预构建镜像
# =============================================================================
# 场景: 仅启动 PostgreSQL + Redis，后端和前端在本地运行
#
# 使用方式:
#   启动:       docker compose -f docker/docker-compose.infra.yml up -d
#   查看日志:   docker compose -f docker/docker-compose.infra.yml logs -f
#   停止:       docker compose -f docker/docker-compose.infra.yml down
#   清理数据:   docker compose -f docker/docker-compose.infra.yml down -v
#
# 启动后在本地运行后端和前端:
#   后端: cd backend && alembic upgrade head && uvicorn main:app --reload
#   前端: cd frontend && npm run dev
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL + PGMQ 数据库
  # ---------------------------------------------------------------------------
  postgres:
    image: ghcr.io/cefso/sentinelx/postgres:latest
    container_name: sentinelx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinelx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-network

  # ---------------------------------------------------------------------------
  # Redis 缓存服务器
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-network

networks:
  sentinelx-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
