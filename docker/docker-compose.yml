# =============================================================================
# SentinelX 全栈 - GitHub 预构建镜像
# =============================================================================
# 场景: 使用 ghcr.io 上的预构建镜像启动完整服务
# 注意: 预构建镜像不支持 ARM64 (Apple Silicon)，需使用 build 版本
#
# 使用方式:
#   启动:       docker compose -f docker/docker-compose.yml up -d
#   仅启动应用: docker compose -f docker/docker-compose.yml up -d backend frontend
#   查看日志:   docker compose -f docker/docker-compose.yml logs -f
#   停止:       docker compose -f docker/docker-compose.yml down
#   清理数据:   docker compose -f docker/docker-compose.yml down -v
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend API 后端服务
  # ---------------------------------------------------------------------------
  backend:
    image: ghcr.io/cefso/sentinelx/backend:latest
    container_name: sentinelx-backend
    ports:
      - "8001:8000"
      - "5678:5678"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: sentinelx
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEBUG: "true"
      DEFAULT_ADMIN_PASSWORD: "Admin@123456"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sentinelx-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Frontend 前端应用
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/cefso/sentinelx/frontend:latest
    container_name: sentinelx-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sentinelx-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PostgreSQL + PGMQ 数据库
  # ---------------------------------------------------------------------------
  postgres:
    image: ghcr.io/cefso/sentinelx/postgres:latest
    container_name: sentinelx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinelx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-network

  # ---------------------------------------------------------------------------
  # Redis 缓存服务器
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-network

  # ---------------------------------------------------------------------------
  # pgAdmin 数据库管理工具 (可选, 需 --profile tools)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentinelx-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sentinelx.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - sentinelx-network

  # ---------------------------------------------------------------------------
  # Redis Commander 管理工具 (可选, 需 --profile tools)
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sentinelx-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - tools
    networks:
      - sentinelx-network

networks:
  sentinelx-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
