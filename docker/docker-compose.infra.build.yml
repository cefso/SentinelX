# =============================================================================
# SentinelX 基础设施 - 本地构建镜像
# =============================================================================
# 场景: 从本地 Dockerfile 构建 PostgreSQL (含 PGMQ 扩展)，后端和前端在本地运行
# 适用: Apple Silicon (M1/M2/M3) 或需要自定义 PG 镜像
#
# 使用方式 (需要在 docker/ 目录下执行):
#   构建并启动: cd docker && docker compose -f docker-compose.infra.build.yml up -d --build
#   查看日志:   cd docker && docker compose -f docker-compose.infra.build.yml logs -f
#   停止:       cd docker && docker compose -f docker-compose.infra.build.yml down
#   清理数据:   cd docker && docker compose -f docker-compose.infra.build.yml down -v
#
# 启动后在本地运行后端和前端:
#   后端: cd backend && alembic upgrade head && uvicorn main:app --reload
#   前端: cd frontend && npm run dev
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL + PGMQ 数据库 (本地构建)
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.pg
    container_name: sentinelx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinelx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-network

  # ---------------------------------------------------------------------------
  # Redis 缓存服务器
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-network

networks:
  sentinelx-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
