# =============================================================================
# SentinelX 全栈 - 本地构建镜像
# =============================================================================
# 场景: 从本地 Dockerfile 构建镜像并启动完整服务
# 适用: Apple Silicon (M1/M2/M3) 或需要修改代码后测试
#
# 使用方式 (需要在 docker/ 目录下执行):
#   构建并启动: cd docker && docker compose -f docker-compose.build.yml up -d --build
#   仅启动应用: cd docker && docker compose -f docker-compose.build.yml up -d --build backend frontend
#   查看日志:   cd docker && docker compose -f docker-compose.build.yml logs -f
#   停止:       cd docker && docker compose -f docker-compose.build.yml down
#   清理数据:   cd docker && docker compose -f docker-compose.build.yml down -v
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend API 后端服务 (本地构建)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sentinelx-backend
    ports:
      - "8001:8000"
      - "5678:5678"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: sentinelx
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEBUG: "true"
      DEFAULT_ADMIN_PASSWORD: "Admin@123456"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sentinelx-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Frontend 前端应用 (本地构建)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sentinelx-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sentinelx-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PostgreSQL + PGMQ 数据库 (本地构建)
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.pg
    container_name: sentinelx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinelx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-network

  # ---------------------------------------------------------------------------
  # Redis 缓存服务器
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-network

  # ---------------------------------------------------------------------------
  # pgAdmin 数据库管理工具 (可选, 需 --profile tools)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentinelx-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sentinelx.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - sentinelx-network

  # ---------------------------------------------------------------------------
  # Redis Commander 管理工具 (可选, 需 --profile tools)
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sentinelx-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - tools
    networks:
      - sentinelx-network

networks:
  sentinelx-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
